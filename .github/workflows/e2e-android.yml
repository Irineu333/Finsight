name: E2E Android

# Runs the Maestro suite against a headless emulator. Manual and on demand rather than on every
# push: an emulator boot dominates the run, so the unit suite stays the fast feedback loop.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

jobs:
  maestro:
    # The `e2e` label is the switch, and it is read from the pull request rather than from the
    # event: `github.event.label` only exists on `labeled`, so testing it would run the suite once,
    # at the moment the label lands, and never again for the commits that follow it. Reading the
    # PR's labels makes `synchronize` re-run a labelled PR on every push, which is the point of
    # labelling it. `workflow_dispatch` always runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    # A hardware-accelerated emulator needs a nested-virtualisation-capable runner.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:android:assembleDebug

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Pinned to the same API level and profile as scripts/e2e.sh — the flows scroll, so the
          # screen they scroll on is part of the contract. Two divergences are forced by the host
          # and not a choice: the runner is x86_64, and the Play Store image is not worth its
          # flakiness here. Neither changes the screen the flows scroll on.
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: finsight_e2e
          disable-animations: true
          # The one precondition `scripts/e2e.sh` cannot enforce here. `hw.keyboard` is read at boot,
          # and this action creates *and boots* the AVD before the script gets a look at the device
          # — so the script's own call to this happens only when it boots the emulator itself,
          # which locally is the usual case and here is never. Without this hook CI would run with
          # whatever keyboard `avdmanager` defaulted to, and a lost keystroke would surface as a
          # button that does not submit, three screens later.
          pre-emulator-launch-script: scripts/pin_avd_keyboard.sh finsight_e2e
          # The suite runs through scripts/e2e.sh, not `maestro test` — the script is where the
          # preconditions live (API level, screen, language and the absence of a hardware keyboard,
          # which loses typed text silently). Calling Maestro directly skips all of them and
          # produces a green run that proves less than it appears to.
          script: |
            adb install -r -t app/android/build/outputs/apk/debug/android-debug.apk
            scripts/e2e.sh --skip-build

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: .maestro/report
          if-no-files-found: ignore
