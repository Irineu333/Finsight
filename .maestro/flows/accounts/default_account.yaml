appId: com.neoutils.finsight
name: accounts_default_account_is_seeded
tags:
  - smoke
  - accounts
---
# A first-run app is never account-less: opening the dashboard settles a default account, so the
# user can record a transaction without being sent to set one up first. This asserts that arrival,
# not the rule behind it — which branch of `EnsureDefaultAccountUseCase` produced the account is a
# question for its unit test.
- runFlow: ../../subflows/launch_fresh.yaml

- scrollUntilVisible:
    element:
      id: "nav_item_accounts"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "nav_item_accounts"

- extendedWaitUntil:
    visible:
      id: "screen_accounts"
    timeout: 15000

# The account exists and carries the default marker. Its name is a translated resource, so the
# badge — not the word "Carteira" — is what says "this one is the default".
- assertVisible:
    id: "account_card"
- assertVisible:
    id: "account_default_badge"
