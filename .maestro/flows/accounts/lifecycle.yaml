appId: com.neoutils.finsight
name: accounts_lifecycle
tags:
  - accounts
  - ledger
env:
  # The seeded account's name is a translated resource (`account_default_name`), so naming it is
  # naming copy. It is declared once here rather than spelled at each use: the device is fixed to
  # English (README §2.2), and a rewording is then this one line instead of a hunt.
  DEFAULT_ACCOUNT: "Wallet"
  TRIAL_ACCOUNT: "E2E Scratch"
  NEW_ACCOUNT: "E2E Savings"
  INCOME_TITLE: "E2E Bonus"
  INCOME_DIGITS: "37500"
  TRANSFER_TYPO_DIGITS: "15550"
  TRANSFER_DIGITS: "12550"
  YIELD_DIGITS: "4075"
---
# An account from its creation to its retirement: created, funded, money moved to the seeded one,
# declared to earn and then earning, and finally emptied by a balance adjustment and archived.
#
# A scratch account opens the story and is deleted straight away. It is the same claim seen from
# its other end — retirement is deletion while nothing points at the row, and archiving once
# something does — and it costs the arithmetic below nothing, because an account deleted empty
# leaves no entry behind.
#
# The figures are chosen so every one of them is distinct: $375.00 in, $125.50 across, leaving $249.50
# on the new account and $125.50 on the seeded one — and $375.00 in total, because a transfer
# between two assets moves money without creating or destroying any. That last one is the claim
# worth the emulator time.
#
# The yield adds $40.75 to the account without adding it to "Money In" — it repartitions the income
# rather than summing over it — so the account holds $290.25 when the adjustment writes it off, and
# 375.00 + 40.75 - 290.25 leaves the $125.50 the transfer had already moved to safety.
#
# The tail is one story rather than two because archiving *requires* a zero balance: the adjustment
# is not a step placed before the archive for convenience, it is the only thing that makes the
# archive possible. Both branches of that refusal are asserted, on either side of the adjustment.

- runFlow: ../../subflows/launch_fresh.yaml

# The dashboard withholds its accounts row while the seeded account is the only one. The day-zero
# story asserts that absence; this is the other half — the row appears once a second account exists.
- assertNotVisible:
    id: "dashboard_component_accounts_overview"

# --- I create an account -------------------------------------------------------------------------
- runFlow:
    file: ../../subflows/open_section.yaml
    env:
      SECTION: accounts
- extendedWaitUntil:
    visible:
      id: "screen_accounts"
    timeout: 15000

# --- An account nothing ever touched is deleted, not archived ------------------------------------
# Which of delete and archive the screen offers is `retireActionOf(hasMovement)`, and this is its
# `false` branch — taken, not merely read: a command asserted enabled and never pressed proves the
# label, not the deed. The row leaves the database, which the pager shows by having nothing left to
# turn to; the story's own account is created afterwards, so this one costs the tail nothing.
- runFlow:
    file: ../../subflows/create_account.yaml
    env:
      NAME: ${TRIAL_ACCOUNT}
- extendedWaitUntil:
    visible:
      id: "account_name"
      text: ${DEFAULT_ACCOUNT}
    timeout: 15000
- swipe:
    from:
      id: "account_card"
    direction: LEFT
    duration: 400
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ${TRIAL_ACCOUNT}
    timeout: 15000
- assertVisible:
    id: "account_retire_label"
    text: "Delete"
- assertVisible:
    id: "account_retire"
    enabled: true
- tapOn:
    id: "account_retire"
- extendedWaitUntil:
    visible:
      id: "delete_account_confirm"
    timeout: 15000
- tapOn:
    id: "delete_account_confirm"

# The seeded account is the only page again. Asserted on the node that renders a name — the pager
# holds one account at a time, so the absence is read where the presence was read four steps above.
- extendedWaitUntil:
    visible:
      id: "account_name"
      text: ${DEFAULT_ACCOUNT}
    timeout: 15000
- assertNotVisible:
    id: "account_name"
    text: ${TRIAL_ACCOUNT}

# --- I create the account this story is about ----------------------------------------------------
- runFlow:
    file: ../../subflows/create_account.yaml
    env:
      NAME: ${NEW_ACCOUNT}

# ...and I can reach it. The accounts screen is a pager: one account at a time, swiped horizontally,
# and the summary figures on screen always belong to the one in view.
# Anchored on the first account being rendered, not merely on the screen existing: a swipe issued
# while the pager is still composing is swallowed, and the page never turns. `waitForAnimationToEnd`
# after it lets the settle finish before anything is read off the page.
- extendedWaitUntil:
    visible:
      id: "account_name"
      text: ${DEFAULT_ACCOUNT}
    timeout: 15000
- swipe:
    from:
      id: "account_card"
    direction: LEFT
    duration: 400
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ${NEW_ACCOUNT}
    timeout: 15000
- assertVisible:
    id: "account_balance_amount"
    text: "[$]0[.,]00"

# The "before" of a before-and-after on one account: with no movement yet it is offered deletion,
# and once it has history the same button offers archiving instead (asserted further down). The
# branch itself was taken by the scratch account above; what this pair adds is that the offer
# *changes under the same row*, which one account read twice is the only way to state.
- assertVisible:
    id: "account_retire_label"
    text: "Delete"
- assertVisible:
    id: "account_retire"
    enabled: true

# ...and the dashboard now has something to say about accounts. Reaching the section scrolled the
# dashboard down, so this scrolls back before asserting — otherwise the row would be missing only
# because the viewport moved.
- back
- scrollUntilVisible:
    element:
      id: "dashboard_component_accounts_overview"
    direction: UP
    timeout: 25000

# --- I put money in it ---------------------------------------------------------------------------
# The account picker is a dropdown, and its options are account names — here, the name this flow
# typed itself, so selecting by text is selecting by the thing under test.
- tapOn:
    id: "add_transaction_fab"
- extendedWaitUntil:
    visible:
      id: "add_transaction_title"
    timeout: 15000
- tapOn:
    id: "add_transaction_type_income"
- waitForAnimationToEnd

- tapOn:
    id: "add_transaction_title"
- waitForAnimationToEnd
- inputText: ${INCOME_TITLE}
- assertVisible:
    id: "add_transaction_title"
    text: ${INCOME_TITLE}
- hideKeyboard

- tapOn:
    id: "add_transaction_account"
- extendedWaitUntil:
    visible: ${NEW_ACCOUNT}
    timeout: 10000
- tapOn: ${NEW_ACCOUNT}
# Read back: the wait above only proves the menu opened, and the form defaults to the seeded
# account — so without this, an income that quietly stayed on the Wallet would be caught two
# screens later as a figure on the wrong card, or not at all.
- assertVisible:
    id: "add_transaction_account"
    text: ${NEW_ACCOUNT}

- scrollUntilVisible:
    element:
      id: "add_transaction_amount"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "add_transaction_amount"
- waitForAnimationToEnd
- inputText: ${INCOME_DIGITS}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "add_transaction_save"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "add_transaction_save"
- extendedWaitUntil:
    notVisible:
      id: "add_transaction_title"
    timeout: 15000

# It landed on the account it was addressed to, and nowhere else.
- runFlow:
    file: ../../subflows/open_section.yaml
    env:
      SECTION: accounts
- extendedWaitUntil:
    visible:
      id: "screen_accounts"
    timeout: 15000
# Anchored on the first account being rendered, not merely on the screen existing: a swipe issued
# while the pager is still composing is swallowed, and the page never turns. `waitForAnimationToEnd`
# after it lets the settle finish before anything is read off the page.
- extendedWaitUntil:
    visible:
      id: "account_name"
      text: ${DEFAULT_ACCOUNT}
    timeout: 15000
- swipe:
    from:
      id: "account_card"
    direction: LEFT
    duration: 400
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ${NEW_ACCOUNT}
    timeout: 15000
- assertVisible:
    id: "account_income_amount"
    text: "[+][$]375[.,]00"
- assertVisible:
    id: "account_balance_amount"
    text: "[$]375[.,]00"
- assertVisible: ${INCOME_TITLE}

# ...and now that it has history, deleting it is no longer on the table — the same button offers
# archiving instead, which is what keeps the history from being destroyed by a stray tap.
- assertVisible:
    id: "account_retire_label"
    text: "Archive"
- assertNotVisible:
    id: "account_retire_label"
    text: "Delete"

# --- I move some of it to the wallet, and get the amount wrong -----------------------------------
# Opened from the account in view, so it is the source; the destination is picked by name. The
# figure typed here is a typo — $155.50 — and the act below corrects it **in place**, which is the
# only path in the app that rewrites two monetary legs at once. Doing it as a mistake-then-fix
# rather than as an extra transfer is what leaves every figure downstream untouched: after the
# correction the account holds the same $249.50 it would have held had the typo never happened,
# and that identity is the claim.
- tapOn:
    id: "account_transfer"
- extendedWaitUntil:
    visible:
      id: "transfer_save"
    timeout: 15000
- assertVisible:
    id: "transfer_source_account"
    text: ${NEW_ACCOUNT}
- tapOn:
    id: "transfer_destination_account"
- extendedWaitUntil:
    visible: ${DEFAULT_ACCOUNT}
    timeout: 10000
- tapOn: ${DEFAULT_ACCOUNT}
- assertVisible:
    id: "transfer_destination_account"
    text: ${DEFAULT_ACCOUNT}
- tapOn:
    id: "transfer_amount"
- waitForAnimationToEnd
- inputText: ${TRANSFER_TYPO_DIGITS}
- hideKeyboard
- tapOn:
    id: "transfer_save"
- extendedWaitUntil:
    notVisible:
      id: "transfer_save"
    timeout: 15000

# The typo is on the ledger, and both accounts already believe it: $375.00 − $155.50.
- extendedWaitUntil:
    visible: ${NEW_ACCOUNT}
    timeout: 15000
- assertVisible:
    id: "account_balance_amount"
    text: "[$]219[.,]50"

# --- I correct it without deleting it ------------------------------------------------------------
# A transfer used to have no way back: the detail offered no edit, and the only remedy was to
# delete the operation and register another. It is corrected here, and it stays the same operation.
- scrollUntilVisible:
    element:
      id: "transaction_card_title"
      text: "Transfer"
    direction: DOWN
    centerElement: true
    timeout: 25000
- tapOn:
    id: "transaction_card_title"
    text: "Transfer"
- extendedWaitUntil:
    visible:
      id: "view_transaction_edit"
    timeout: 15000
- assertVisible:
    id: "view_transaction_amount"
    text: "[$]155[.,]50"
- tapOn:
    id: "view_transaction_edit"

# The form that corrects a transfer is the form that wrote it, and it opens over the operation's
# own two ends — not empty, and not on whichever account the app would have defaulted to. Nothing
# below this screen proves that: the seeding reads the ledger's own source and destination legs.
- extendedWaitUntil:
    visible:
      id: "transfer_save"
    timeout: 15000
- assertVisible:
    id: "transfer_source_account"
    text: ${NEW_ACCOUNT}
- assertVisible:
    id: "transfer_destination_account"
    text: ${DEFAULT_ACCOUNT}
- assertVisible:
    id: "transfer_amount"
    text: ".*155[.,]50.*"

# Erased before retyping: the money field appends digits rather than replacing them, so typing
# over $155.50 would read as $15,550.00.
- tapOn:
    id: "transfer_amount"
- waitForAnimationToEnd
- eraseText: 20
- inputText: ${TRANSFER_DIGITS}
- assertVisible:
    id: "transfer_amount"
    text: ".*125[.,]50.*"
- hideKeyboard
- tapOn:
    id: "transfer_save"
- extendedWaitUntil:
    notVisible:
      id: "transfer_save"
    timeout: 15000

# Saving returns to the detail sheet, which re-reads the operation instead of echoing the form —
# and it is the *same* operation, corrected, not a second one standing beside the first.
- extendedWaitUntil:
    visible:
      id: "view_transaction_amount"
      text: "[$]125[.,]50"
    timeout: 15000
- back
- extendedWaitUntil:
    notVisible:
      id: "view_transaction_edit"
    timeout: 15000

# --- Each account tells its own side of it -------------------------------------------------------
- scrollUntilVisible:
    element:
      id: "account_balance_amount"
    direction: UP
    timeout: 25000
- extendedWaitUntil:
    visible: ${NEW_ACCOUNT}
    timeout: 15000
- assertVisible:
    id: "account_balance_amount"
    text: "[$]249[.,]50"

# Turned back by coordinates rather than `from: account_card`, which is the one swipe on this screen
# that cannot be issued by element: the card spans the width, so a RIGHT swipe anchored on it starts
# at the left edge and Android reads it as the back gesture, leaving the screen instead of turning
# the page. Starting at 30% of the width is past that strip, so the pager gets the gesture.
- swipe:
    start: 30%, 30%
    end: 85%, 30%
    duration: 400
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "account_name"
      text: ${DEFAULT_ACCOUNT}
    timeout: 15000
- assertVisible:
    id: "account_balance_amount"
    text: "[$]125[.,]50"

# The seeded account is the default one, and the default cannot be retired at all. The screen still
# shows the action — disabled — rather than hiding it, so the refusal is visible instead of puzzling.
- assertVisible:
    id: "account_retire"
    enabled: false

# --- And the whole is unchanged ------------------------------------------------------------------
# Nothing entered or left the ledger, so net worth is exactly the income. A transfer that moved the
# total would be a transfer that leaked.
- back
- scrollUntilVisible:
    element:
      id: "dashboard_total_balance_amount"
    direction: UP
    timeout: 25000
- assertVisible:
    id: "dashboard_total_balance_amount"
    text: "[$]375[.,]00"

- scrollUntilVisible:
    element:
      id: "dashboard_component_recents"
    direction: DOWN
    centerElement: true
    timeout: 25000
- assertVisible:
    id: "transaction_card_title"
    text: "Transfer"

- tapOn:
    id: "nav_item_transactions"
- extendedWaitUntil:
    visible:
      id: "screen_transactions"
    timeout: 15000
- assertVisible:
    id: "transaction_card_title"
    text: "Transfer"
- assertVisible: ${INCOME_TITLE}

# The two sides of the transfer read through the report belong to `report/lifecycle`: scoping a
# report to one account and then the other is a claim about the report, and it needs no transfer
# this flow has not already made.

# --- I want the account gone, and the app will not have it --------------------------------------
- tapOn:
    id: "nav_item_dashboard"
- extendedWaitUntil:
    visible:
      id: "bottom_navigation_bar"
    timeout: 15000
- runFlow:
    file: ../../subflows/open_section.yaml
    env:
      SECTION: accounts
- extendedWaitUntil:
    visible:
      id: "screen_accounts"
    timeout: 15000
# Anchored on the first account being rendered, not merely on the screen existing: a swipe issued
# while the pager is still composing is swallowed, and the page never turns. `waitForAnimationToEnd`
# after it lets the settle finish before anything is read off the page.
- extendedWaitUntil:
    visible:
      id: "account_name"
      text: ${DEFAULT_ACCOUNT}
    timeout: 15000
- swipe:
    from:
      id: "account_card"
    direction: LEFT
    duration: 400
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ${NEW_ACCOUNT}
    timeout: 15000

# --- The account earns, and one feature writes into another's ------------------------------------
# Declaring a yield is what creates the yield category, on demand, in the real database — a write
# accounts makes into the categories facade, guarded by a unique index on the system key. Nothing
# below this screen exercises that: every layer under it has the other side mocked.
#
# The premise for this absence is the card that was just read above: the balance is on screen, so
# the line is genuinely missing rather than merely not composed yet.
- assertNotVisible:
    id: "account_yield_amount"

- scrollUntilVisible:
    element:
      id: "account_edit"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "account_edit"
- extendedWaitUntil:
    visible:
      id: "account_form_yield"
    timeout: 15000
- tapOn:
    id: "account_form_yield"
# Read the switch back: a tap that landed beside it has to fail here, not three screens later as a
# line that never appears.
- assertVisible:
    id: "account_form_yield"
    checked: true
- scrollUntilVisible:
    element:
      id: "account_form_save"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "account_form_save"
- extendedWaitUntil:
    notVisible:
      id: "account_form_yield"
    timeout: 15000

# The line arrives at zero, because it is itself the path to the first launch and deriving it from
# the launches would hide it exactly when it is needed. And declaring is not earning: the two
# figures that were already there are untouched.
- extendedWaitUntil:
    visible:
      id: "account_yield_amount"
      text: "[+][$]0[.,]00"
    timeout: 15000
- assertVisible:
    id: "account_income_amount"
    text: "[+][$]375[.,]00"
- assertVisible:
    id: "account_balance_amount"
    text: "[$]249[.,]50"

# The launch opens from the account in view, so that is where the money lands — read back, because
# the sheet resolves the account itself and a silent swap would be money on the wrong card.
- tapOn:
    id: "account_yield_amount"
- extendedWaitUntil:
    visible:
      id: "launch_yield_save"
    timeout: 15000
- assertVisible:
    id: "launch_yield_account"
    text: ${NEW_ACCOUNT}
- tapOn:
    id: "launch_yield_amount"
- waitForAnimationToEnd
- inputText: ${YIELD_DIGITS}
- assertVisible:
    id: "launch_yield_amount"
    text: "[$]40[.,]75"
- hideKeyboard
- tapOn:
    id: "launch_yield_save"
- extendedWaitUntil:
    notVisible:
      id: "launch_yield_save"
    timeout: 15000

# The whole claim, in three figures: the balance grew by $40.75, "Money In" did *not*, and the money
# stands on the line that exists to hold it apart. A yield whose dimension failed to resolve would
# land inside "Money In" and read $415.75 here — and would pass every test below this screen.
- extendedWaitUntil:
    visible:
      id: "account_yield_amount"
      text: "[+][$]40[.,]75"
    timeout: 15000
- assertVisible:
    id: "account_income_amount"
    text: "[+][$]375[.,]00"
- assertVisible:
    id: "account_balance_amount"
    text: "[$]290[.,]25"

# ...and it was written as a transaction, not as a figure on a card. It carries no title of its own:
# the name on the row is the category the declaration created a moment ago, which is the dimension
# surviving the write and coming back named.
- scrollUntilVisible:
    element:
      id: "transaction_card_amount"
      text: "[$]40[.,]75"
    direction: DOWN
    centerElement: true
    timeout: 25000
- assertVisible:
    id: "transaction_card_title"
    text: "Yield"

# The yield line made the card taller, so the retire action is no longer where the flow left it.
- scrollUntilVisible:
    element:
      id: "account_retire"
    direction: UP
    timeout: 25000

# The refusal, stated before the attempt: an account still holding money cannot be archived, and the
# sheet says so with the command disabled rather than by failing after the tap. This is the `false`
# branch of the rule the adjustment below is about to flip.
- tapOn:
    id: "account_retire"
- extendedWaitUntil:
    visible:
      id: "archive_account_confirm"
    timeout: 15000
- assertVisible:
    id: "archive_account_confirm"
    enabled: false
- back
- extendedWaitUntil:
    notVisible:
      id: "archive_account_confirm"
    timeout: 15000

# --- I empty it with an adjustment ---------------------------------------------------------------
# The balance line is itself the command — tapping the figure opens the sheet that sets it. The field
# arrives holding the current balance, so it is erased before the new one is typed: the money input
# appends digits rather than replacing them, and typing over $290.25 would read as $29,025.00.
- tapOn:
    id: "account_balance_amount"
- extendedWaitUntil:
    visible:
      id: "edit_account_balance_amount"
    timeout: 15000
- tapOn:
    id: "edit_account_balance_amount"
- waitForAnimationToEnd
- eraseText: 20
- inputText: "0"
- assertVisible:
    id: "edit_account_balance_amount"
    text: "[$]0[.,]00"
- hideKeyboard
- tapOn:
    id: "edit_account_balance_save"
- extendedWaitUntil:
    notVisible:
      id: "edit_account_balance_amount"
    timeout: 15000

# What an adjustment is, read off the card: not an erasure but a movement of its own. The balance is
# zero, the income and the yield the account was funded with are both untouched, and the difference
# stands on the line that exists to name it — the only line whose direction its label withholds,
# hence the sign.
- extendedWaitUntil:
    visible:
      id: "account_adjustment_amount"
    timeout: 15000
- assertVisible:
    id: "account_balance_amount"
    text: "[$]0[.,]00"
- assertVisible:
    id: "account_income_amount"
    text: "[+][$]375[.,]00"
- assertVisible:
    id: "account_yield_amount"
    text: "[+][$]40[.,]75"
- assertVisible:
    id: "account_adjustment_amount"
    text: "[-][$]290[.,]25"

# ...and it was written as a transaction, not as a number on a card. It stands in the account's own
# list, beside the income, the transfer and the yield that preceded it — and it is the one row whose
# sign is spelled out, because "adjustment" alone does not say in which direction
# (`itemDisplayAmount`).
- scrollUntilVisible:
    element:
      id: "transaction_card_amount"
      text: "[-][$]290[.,]25"
    direction: DOWN
    centerElement: true
    timeout: 25000

# --- Now it can be archived ----------------------------------------------------------------------
# The same command as above, on the same account, offering the opposite answer. Nothing about the
# account changed except its balance, which is the whole rule.
- scrollUntilVisible:
    element:
      id: "account_retire"
    direction: UP
    timeout: 25000
- assertVisible:
    id: "account_retire_label"
    text: "Archive"
- tapOn:
    id: "account_retire"
- extendedWaitUntil:
    visible:
      id: "archive_account_confirm"
    timeout: 15000
- assertVisible:
    id: "archive_account_confirm"
    enabled: true
- tapOn:
    id: "archive_account_confirm"
- extendedWaitUntil:
    notVisible:
      id: "archive_account_confirm"
    timeout: 15000

# The pager holds only the seeded account now, and its balance is what the transfer left it — the
# archive retired an account, it did not take its money with it.
- extendedWaitUntil:
    visible: ${DEFAULT_ACCOUNT}
    timeout: 15000
# Read on the node that renders an account's name, not as loose text: a bare `assertNotVisible` of
# the name would also pass on a screen that failed to compose at all.
- assertVisible:
    id: "account_name"
    text: ${DEFAULT_ACCOUNT}
- assertNotVisible:
    id: "account_name"
    text: ${NEW_ACCOUNT}
- assertVisible:
    id: "account_balance_amount"
    text: "[$]125[.,]50"

# --- Archived is retired, not deleted ------------------------------------------------------------
# The account is still there to be found, which is the promise archiving makes and deletion does not.
- tapOn:
    id: "accounts_more_options"
- extendedWaitUntil:
    visible:
      id: "accounts_view_archived"
    timeout: 15000
- tapOn:
    id: "accounts_view_archived"
- extendedWaitUntil:
    visible:
      id: "screen_archived_accounts"
    timeout: 15000
- assertVisible: ${NEW_ACCOUNT}

# --- And the dashboard is back to having one account ---------------------------------------------
# The row appeared when the second account was created; retiring it takes the row away again, by the
# same rule (HIDE_SINGLE_ACCOUNT) that withheld it on day zero. The premise for the absence is the
# component that follows it: the cards pager sits at position 5 and the accounts row at position 4,
# so a visible pager means the row was laid out and is genuinely missing rather than below the fold.
- back
- back
- extendedWaitUntil:
    visible:
      id: "bottom_navigation_bar"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "dashboard_total_balance_amount"
    direction: UP
    timeout: 25000
- assertVisible:
    id: "dashboard_component_credit_cards_pager"
- assertNotVisible:
    id: "dashboard_component_accounts_overview"

# The adjustment left the ledger too: $375.00 earned, $40.75 yielded, $290.25 written off, and the
# $125.50 the transfer had already moved to safety is all that is left.
- assertVisible:
    id: "dashboard_total_balance_amount"
    text: "[$]125[.,]50"
