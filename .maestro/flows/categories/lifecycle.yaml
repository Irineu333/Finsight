appId: com.neoutils.finsight
name: categories_lifecycle
tags:
  - categories
env:
  TRIAL_CATEGORY: "E2E Trial"
  CATEGORY: "E2E Bakery"
  EXPENSE_TITLE: "E2E Croissant"
  EXPENSE_DIGITS: "6340"
  LOOSE_TITLE: "E2E Newspaper"
  LOOSE_DIGITS: "2175"
---
# A category is a dimension, not an account: with no movement it deletes and the screen falls back
# to day zero; with movement the same button offers archiving instead, and archived it leaves the
# sheet's selector without taking the spending it classified — or the list's cut, which keeps it
# precisely because that history has to stay reachable — and unarchiving brings it back whole.
#
# It is one story because each act is the previous one's product: archiving is only offered because
# an expense was written, the empty selector only exists because the one category was archived, and
# `launch_fresh` wipes the database, so a second half would have to rebuild all of it first.
#
# What is *not* here, deliberately: the fourteen seeded defaults (`CreateDefaultCategoriesUseCase`,
# unit-tested — this flow never takes that offer, it only watches it appear and disappear), the
# matrix of refusals that produces "must archive" (`ResolveCategoryRetirabilityUseCaseTest`), and
# the per-filter sectioning (`CategoriesViewModelTest`). One instance of each swap is E2E's share.
#
# The figures — $63.40 and $21.75 — share no digits, so no assertion can pass by reading a
# neighbour. There is no $0.00 to read any more: a category with nothing posted to it states an
# absence in words rather than a zero, and the detail no longer counts transactions in a month,
# because without a month selector "transactions this month" has no month.

- runFlow: ../../subflows/launch_fresh.yaml

# --- Day zero offers two things ------------------------------------------------------------------
# A fresh install has a default account but no categories at all, and that is the only state that
# earns the seed button. It is never tapped here; it exists in this flow to die and come back.
- runFlow:
    file: ../../subflows/open_section.yaml
    env:
      SECTION: categories
- extendedWaitUntil:
    visible:
      id: "screen_categories"
    timeout: 15000
- assertVisible:
    id: "categories_create_default"
- assertVisible:
    id: "categories_add"

# --- I create one, and the day-zero offer is gone ------------------------------------------------
- runFlow:
    file: ../../subflows/create_category.yaml
    env:
      NAME: ${TRIAL_CATEGORY}
- extendedWaitUntil:
    visible:
      id: "category_card_name"
    timeout: 15000
- assertVisible:
    id: "category_card_name"
    text: ${TRIAL_CATEGORY}
# Not merely off-screen: the card above proves the list composed. The seed button is withheld
# because the database stopped being empty — a distinction no state below the screen encodes.
- assertNotVisible:
    id: "categories_create_default"

# --- With no movement, it deletes ----------------------------------------------------------------
- tapOn:
    id: "category_card_name"
    text: ${TRIAL_CATEGORY}
- extendedWaitUntil:
    visible:
      id: "category_retire_label"
    timeout: 15000
# With nothing posted to it there is no figure to state, and a zero in the highlight would
# read as a failure rather than as an absence — so the detail says so in words instead.
- assertVisible:
    id: "view_category_empty"
- assertNotVisible:
    id: "view_category_month_amount"
- assertNotVisible:
    id: "view_category_total_amount"
- assertVisible:
    id: "category_retire_label"
    text: "Delete"
- tapOn:
    id: "category_retire"
- extendedWaitUntil:
    visible:
      id: "delete_category_confirm"
    timeout: 15000
- tapOn:
    id: "delete_category_confirm"

# The row is gone from the database, not hidden from a view: the screen is back in the state only
# an empty database earns, and the offer that vanished five steps ago is on screen again.
- extendedWaitUntil:
    visible:
      id: "categories_create_default"
    timeout: 15000
- assertNotVisible:
    id: "category_card"

# --- I create the one this story is about --------------------------------------------------------
- runFlow:
    file: ../../subflows/create_category.yaml
    env:
      NAME: ${CATEGORY}
- extendedWaitUntil:
    visible:
      id: "category_card_name"
    timeout: 15000
- assertVisible:
    id: "category_card_name"
    text: ${CATEGORY}

# --- I spend $63.40 on it ------------------------------------------------------------------------
- back
- runFlow:
    file: ../../subflows/record_categorized_expense.yaml
    env:
      TITLE: ${EXPENSE_TITLE}
      AMOUNT: ${EXPENSE_DIGITS}
      CATEGORY: ${CATEGORY}

# --- With movement, the offer changes ------------------------------------------------------------
# This is the flow's central claim: a write made through another feature's sheet changed the command
# this one offers. The label is read on the node that renders the word, and its counterpart is
# asserted absent on that same node — so a screen that rendered both would fail here.
- runFlow:
    file: ../../subflows/open_section.yaml
    env:
      SECTION: categories
- extendedWaitUntil:
    visible:
      id: "screen_categories"
    timeout: 15000
- tapOn:
    id: "category_card_name"
    text: ${CATEGORY}
- extendedWaitUntil:
    visible:
      id: "category_retire_label"
    timeout: 15000
# The money lands in the current month, which is the highlight while the category is live.
# `launch_fresh` wipes the database, so this category has no closed month behind it at all:
# there is no window to average over, and the variation says why in words instead of
# spelling a `0%` nobody measured.
- assertVisible:
    id: "view_category_month_amount"
    text: "[$]63[.,]40"
- assertNotVisible:
    id: "view_category_total_amount"
- assertVisible:
    id: "view_category_variation"
# The command that replaces the period control this detail no longer has, above the fold.
- assertVisible:
    id: "view_category_transactions"
- assertVisible:
    id: "category_retire_label"
    text: "Archive"
- assertNotVisible:
    id: "category_retire_label"
    text: "Delete"

# --- I archive it, and the money stays -----------------------------------------------------------
# Confirming dismisses the confirmation sheet only; the detail observes the category, so it redraws
# itself over the same row with the other offer. The total is re-read afterwards on purpose:
# archiving retires the label, not the spending.
- tapOn:
    id: "category_retire"
- extendedWaitUntil:
    visible:
      id: "archive_category_confirm"
    timeout: 15000
- tapOn:
    id: "archive_category_confirm"
- extendedWaitUntil:
    visible:
      id: "category_unarchive"
    timeout: 15000
- assertNotVisible:
    id: "category_retire"
# Archived, the current month says nothing about it, so the highlight swaps to the whole
# history — the one figure that still answers something. Same money, different claim.
- assertVisible:
    id: "view_category_total_amount"
    text: "[$]63[.,]40"
- assertNotVisible:
    id: "view_category_month_amount"
- back

# --- It leaves the active view without leaving the database --------------------------------------
# Three states the screen must keep apart: empty database, empty filter, and content. This is the
# middle one — a quiet note with no seed button, which is what proves the row is still there.
- extendedWaitUntil:
    visible:
      id: "categories_empty_filter"
    timeout: 15000
- assertNotVisible:
    id: "category_card"
- assertNotVisible:
    id: "categories_create_default"

- tapOn:
    id: "categories_filter"
- extendedWaitUntil:
    visible:
      id: "categories_filter_archived"
    timeout: 15000
- tapOn:
    id: "categories_filter_archived"
- extendedWaitUntil:
    visible:
      id: "category_card_name"
    timeout: 15000
- assertVisible:
    id: "category_card_name"
    text: ${CATEGORY}
- assertVisible:
    id: "category_card_archived_badge"

# --- One flag, three consumers, on purpose reading it differently --------------------------------
# The dashboard still counts what the archived category spent this month — the ledger aggregate
# includes it, so the breakdown must agree. The transaction sheet, meanwhile, has nothing left to
# offer: asserted by the "+" the selector only renders when it is empty, which is evidence the
# category is absent rather than merely out of view inside a popup. The third reader — the list's
# own cut — comes after these two, and answers the opposite of the sheet.
- back
# `back` returns the dashboard wherever the last scroll left it — which is already past the
# component below — so this climbs to the top before descending, or the search runs away from it.
- extendedWaitUntil:
    visible:
      id: "bottom_navigation_bar"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "dashboard_total_balance_amount"
    direction: UP
    timeout: 25000
- scrollUntilVisible:
    element:
      id: "dashboard_component_spending_by_category"
    direction: DOWN
    centerElement: true
    timeout: 25000
- assertVisible: ${CATEGORY}
- assertVisible:
    id: "category_spending_amount"
    text: "[$]63[.,]40"

- tapOn:
    id: "add_transaction_fab"
- extendedWaitUntil:
    visible:
      id: "add_transaction_title"
    timeout: 15000
- tapOn:
    id: "add_transaction_type_expense"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "add_transaction_category"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "category_selector_empty_add"
- back

# --- A third consumer, reading the same flag the other way ---------------------------------------
# The transactions list is cut by the same dimension, and its menu is the one reader that *must*
# keep an archived category: the rows it classified are still in the history, so the cut would
# otherwise become unreachable the moment the category retires. The screen is fed by
# `observeAllCategoriesIncludingClosed`, where the sheet's selector — empty, six steps above — is
# fed the open ones only. One flag, two screens, opposite answers, and no layer below mounts both.
#
# The loose expense exists to make the cut falsifiable: with a single row on the list, "the
# croissant survived the filter" would pass with no filter applied at all. $21.75 shares no digits
# with the $63.40 the category holds, and it is written after every figure above has been read.
#
# The sheet has to be gone before the FAB is tapped again, or the tap races its exit animation and
# is taken by the scrim.
- extendedWaitUntil:
    notVisible:
      id: "add_transaction_title"
    timeout: 15000
- runFlow:
    file: ../../subflows/record_transaction.yaml
    env:
      TYPE: expense
      TITLE: ${LOOSE_TITLE}
      AMOUNT: ${LOOSE_DIGITS}

- tapOn:
    id: "nav_item_transactions"
- extendedWaitUntil:
    visible:
      id: "screen_transactions"
    timeout: 15000
- assertVisible:
    id: "transaction_card_title"
    text: ${EXPENSE_TITLE}
- assertVisible:
    id: "transaction_card_title"
    text: ${LOOSE_TITLE}

# The archived category is still on offer here. Picked by the name this flow typed itself, so the
# option tapped is the row under test rather than a word a translation owns.
- tapOn:
    id: "transactions_filter_category"
- extendedWaitUntil:
    visible: ${CATEGORY}
    timeout: 10000
- tapOn: ${CATEGORY}
- waitForAnimationToEnd

# What it classified stayed; what it did not, went. Both read on the node that renders a title, so
# a match elsewhere on the screen cannot answer for either.
- assertVisible:
    id: "transaction_card_title"
    text: ${EXPENSE_TITLE}
- assertNotVisible:
    id: "transaction_card_title"
    text: ${LOOSE_TITLE}

# --- I unarchive it, and it comes back whole -----------------------------------------------------
# Returning to the dashboard restores it wherever the last scroll left it, which is below the
# quick-action grid the section is reached from — so this climbs before descending again.
- tapOn:
    id: "nav_item_dashboard"
- extendedWaitUntil:
    visible:
      id: "bottom_navigation_bar"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "dashboard_total_balance_amount"
    direction: UP
    timeout: 25000
- runFlow:
    file: ../../subflows/open_section.yaml
    env:
      SECTION: categories
- extendedWaitUntil:
    visible:
      id: "categories_filter"
    timeout: 15000
- tapOn:
    id: "categories_filter"
- extendedWaitUntil:
    visible:
      id: "categories_filter_archived"
    timeout: 15000
- tapOn:
    id: "categories_filter_archived"
- extendedWaitUntil:
    visible:
      id: "category_card_name"
    timeout: 15000
- tapOn:
    id: "category_card_name"
    text: ${CATEGORY}
- extendedWaitUntil:
    visible:
      id: "category_unarchive"
    timeout: 15000
- tapOn:
    id: "category_unarchive"

# Coming back does not erase what it did: the category is still tied to its expense, so the offer
# it earns is still archiving, never deleting.
- extendedWaitUntil:
    visible:
      id: "category_retire_label"
    timeout: 15000
- assertVisible:
    id: "category_retire_label"
    text: "Archive"
- assertNotVisible:
    id: "category_unarchive"
- back

# The exact inverse of the reading three acts ago: it is the archived view that has nothing now.
- extendedWaitUntil:
    visible:
      id: "categories_empty_filter"
    timeout: 15000
- assertNotVisible:
    id: "category_card"
- tapOn:
    id: "categories_filter"
- extendedWaitUntil:
    visible:
      id: "categories_filter_active"
    timeout: 15000
- tapOn:
    id: "categories_filter_active"
- extendedWaitUntil:
    visible:
      id: "category_card_name"
    timeout: 15000
- assertVisible:
    id: "category_card_name"
    text: ${CATEGORY}
- assertNotVisible:
    id: "category_card_archived_badge"

# --- And the selector offers it again ------------------------------------------------------------
# Read on the field that renders the choice, not merely as the absence of the empty state's "+":
# a selector that listed it but would not take the pick reads the same as one that never had it.
- back
# The screen has to be gone before the tap, or the tap races the exit animation.
- extendedWaitUntil:
    notVisible:
      id: "screen_categories"
    timeout: 15000
- tapOn:
    id: "add_transaction_fab"
- extendedWaitUntil:
    visible:
      id: "add_transaction_title"
    timeout: 15000
- tapOn:
    id: "add_transaction_type_expense"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "add_transaction_category"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "add_transaction_category"
- extendedWaitUntil:
    visible: ${CATEGORY}
    timeout: 10000
- tapOn: ${CATEGORY}
- waitForAnimationToEnd
- assertVisible:
    id: "add_transaction_category"
    text: ${CATEGORY}

# --- The detail hands the time question to the screen that answers it ----------------------------
# The period control is gone from the detail; this command is what replaces it, and the claim is
# that the list comes up already cut — nothing is selected on the list itself here.
#
# It is exercised last because it is the only act that leaves the detail for another screen, and
# because it is only falsifiable now: both rows exist, and $21.75 was never classified, so a cut
# that did not happen would leave it on screen.
- back
- extendedWaitUntil:
    notVisible:
      id: "add_transaction_title"
    timeout: 15000
# `back` returns the dashboard wherever the last scroll left it, so this climbs before descending.
- extendedWaitUntil:
    visible:
      id: "bottom_navigation_bar"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "dashboard_total_balance_amount"
    direction: UP
    timeout: 25000
- runFlow:
    file: ../../subflows/open_section.yaml
    env:
      SECTION: categories
- extendedWaitUntil:
    visible:
      id: "screen_categories"
    timeout: 15000
- tapOn:
    id: "category_card_name"
    text: ${CATEGORY}
- extendedWaitUntil:
    visible:
      id: "view_category_transactions"
    timeout: 15000
- tapOn:
    id: "view_category_transactions"
- extendedWaitUntil:
    visible:
      id: "screen_transactions"
    timeout: 15000
# What the category classified is there; what it did not, is gone. Both read on the node that
# renders a title, so a match elsewhere on the screen cannot answer for either.
- assertVisible:
    id: "transaction_card_title"
    text: ${EXPENSE_TITLE}
- assertNotVisible:
    id: "transaction_card_title"
    text: ${LOOSE_TITLE}
# And the control says by what — the cut is not a second mechanism sitting beside it. Read on
# the node that renders the word: the chip's own node carries no text.
- assertVisible:
    id: "transactions_filter_category_label"
    text: ${CATEGORY}
