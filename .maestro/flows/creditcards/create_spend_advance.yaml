appId: com.neoutils.finsight
name: creditcards_create_spend_advance
tags:
  - creditcards
  - ledger
env:
  CARD_NAME: "E2E Card"
  CARD_LIMIT_DIGITS: "200000"
  CARD_CLOSING_DAY: "10"
  CARD_DUE_DAY: "20"
  INCOME_TITLE: "E2E Payday"
  INCOME_DIGITS: "50000"
  SPEND_TITLE: "E2E Laptop"
  SPEND_DIGITS: "12000"
  ADVANCE_DIGITS: "5000"
---
# The credit half of the ledger, told as one story: a card is created, spent on, and paid down
# early. It is a single flow because `launch_fresh` wipes the database — split up, each half would
# have to re-create the card and re-earn the money before it could say anything.
#
# A card is a LIABILITY account, so a card expense creates debt instead of moving cash. That is the
# claim this flow exists for, and it is asserted twice: the account balance does not move when the
# card is spent on, and it does move — by exactly the amount advanced — when the invoice is paid
# down. The figures are chosen so no two share their digits: $2,000.00 of limit, $500.00 earned,
# $120.00 spent, $50.00 advanced, leaving $70.00 owed, $450.00 in the account and $1,930.00 of
# limit available.

- runFlow: ../../subflows/launch_fresh.yaml

# --- Day zero: the offer to create a card, and no card figures yet -------------------------------
# The cards widget shows its empty state (SHOW_EMPTY_STATE) while the card balance row hides
# (HIDE_WHEN_EMPTY). Both are asserted before anything scrolls: a component the viewport has moved
# past is not composed, and `assertNotVisible` cannot tell that apart from one never configured.
- assertVisible:
    id: "dashboard_component_credit_cards_pager"
- assertNotVisible:
    id: "dashboard_component_balance_stats_credit_card"

# --- I am paid, so the account has something to pay a card with ----------------------------------
- runFlow:
    file: ../../subflows/record_transaction.yaml
    env:
      TYPE: income
      TITLE: ${INCOME_TITLE}
      AMOUNT: ${INCOME_DIGITS}

- scrollUntilVisible:
    element:
      id: "dashboard_total_balance_amount"
    direction: UP
    timeout: 25000
- assertVisible:
    id: "dashboard_total_balance_amount"
    text: "[$]500[.,]00"

# --- I create a credit card ----------------------------------------------------------------------
# Reached from the quick-action grid; with no card yet the screen stands in its empty state, whose
# create button carries the same id as the FAB that replaces it.
- runFlow:
    file: ../../subflows/open_section.yaml
    env:
      SECTION: creditCards
- extendedWaitUntil:
    visible:
      id: "screen_credit_cards"
    timeout: 15000

- tapOn:
    id: "credit_cards_add"
- extendedWaitUntil:
    visible:
      id: "credit_card_form_name"
    timeout: 15000

- tapOn:
    id: "credit_card_form_name"
- waitForAnimationToEnd
- inputText: ${CARD_NAME}
- assertVisible:
    id: "credit_card_form_name"
    text: ${CARD_NAME}
- hideKeyboard

- tapOn:
    id: "credit_card_form_limit"
- waitForAnimationToEnd
- inputText: ${CARD_LIMIT_DIGITS}
- hideKeyboard

# Both days are typed, though either alone would do — the form derives the missing one. Typing both
# keeps the invoice period a fact of this flow rather than of a rule it does not assert.
- tapOn:
    id: "credit_card_form_closing_day"
- waitForAnimationToEnd
- inputText: ${CARD_CLOSING_DAY}
- hideKeyboard

- tapOn:
    id: "credit_card_form_due_day"
- waitForAnimationToEnd
- inputText: ${CARD_DUE_DAY}
- hideKeyboard

- scrollUntilVisible:
    element:
      id: "credit_card_form_save"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "credit_card_form_save"
- extendedWaitUntil:
    notVisible:
      id: "credit_card_form_name"
    timeout: 15000

# Creating a card opens its first invoice, so the screen has a card with nothing on it: no debt,
# and the whole limit still available.
- extendedWaitUntil:
    visible:
      id: "credit_card_card"
    timeout: 15000
- assertVisible: ${CARD_NAME}
- assertVisible:
    id: "credit_card_invoice_amount"
    text: "[$]0[.,]00"
- assertVisible:
    id: "credit_card_available_limit"
    text: "[$]2[.,]000[.,]00"

# ...and the dashboard's cards widget now carries the card instead of its empty state.
- back
- scrollUntilVisible:
    element:
      id: "dashboard_component_credit_cards_pager"
    direction: UP
    centerElement: true
    timeout: 25000
- assertVisible: ${CARD_NAME}
- assertVisible:
    id: "dashboard_credit_card_invoice_amount"
    text: "[$]0[.,]00"

# --- I spend $120.00 on it -----------------------------------------------------------------------
# Not the shared `record_transaction` subflow: that one records against an account, and the target
# and card selectors below are the whole point of this leg.
- tapOn:
    id: "add_transaction_fab"
- extendedWaitUntil:
    visible:
      id: "add_transaction_title"
    timeout: 15000
- tapOn:
    id: "add_transaction_type_expense"
- waitForAnimationToEnd

- tapOn:
    id: "add_transaction_title"
- waitForAnimationToEnd
- inputText: ${SPEND_TITLE}
- assertVisible:
    id: "add_transaction_title"
    text: ${SPEND_TITLE}
- hideKeyboard

# The target is what turns an account expense into a card expense. Its options are copy, so they
# are reached by tag; the card below is reached by the name this flow typed itself.
- tapOn:
    id: "add_transaction_target"
- extendedWaitUntil:
    visible:
      id: "target_option_credit_card"
    timeout: 10000
- tapOn:
    id: "target_option_credit_card"
- waitForAnimationToEnd

- tapOn:
    id: "add_transaction_credit_card"
- extendedWaitUntil:
    visible: ${CARD_NAME}
    timeout: 10000
- tapOn: ${CARD_NAME}
- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: "add_transaction_amount"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "add_transaction_amount"
- waitForAnimationToEnd
- inputText: ${SPEND_DIGITS}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "add_transaction_save"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "add_transaction_save"
- extendedWaitUntil:
    notVisible:
      id: "add_transaction_title"
    timeout: 15000

# --- The dashboard: debt appeared, cash did not move ---------------------------------------------
# The balance is still the whole income. A card expense that moved it would be a card expense
# charged to the wrong account — the single assertion this leg exists for.
- scrollUntilVisible:
    element:
      id: "dashboard_total_balance_amount"
    direction: UP
    timeout: 25000
- assertVisible:
    id: "dashboard_total_balance_amount"
    text: "[$]500[.,]00"

# The card balance row was withheld while there was nothing on any card; the spend is what gives
# it something to say.
- scrollUntilVisible:
    element:
      id: "dashboard_component_balance_stats_credit_card"
    direction: DOWN
    centerElement: true
    timeout: 25000
- assertVisible:
    id: "dashboard_credit_card_expenses_amount"
    text: "[$]120[.,]00"

- scrollUntilVisible:
    element:
      id: "dashboard_component_credit_cards_pager"
    direction: UP
    centerElement: true
    timeout: 25000
- assertVisible:
    id: "dashboard_credit_card_invoice_amount"
    text: "[$]120[.,]00"

# --- The cards screen: the same debt, and the limit it consumed ----------------------------------
- runFlow:
    file: ../../subflows/open_section.yaml
    env:
      SECTION: creditCards
- extendedWaitUntil:
    visible:
      id: "screen_credit_cards"
    timeout: 15000
- assertVisible:
    id: "credit_card_invoice_amount"
    text: "[$]120[.,]00"
- assertVisible:
    id: "credit_card_available_limit"
    text: "[$]1[.,]880[.,]00"
- assertVisible: ${SPEND_TITLE}

# --- The invoice: the same debt, broken down -----------------------------------------------------
- tapOn:
    id: "credit_card_card"
- extendedWaitUntil:
    visible:
      id: "screen_invoice_transactions"
    timeout: 15000
- assertVisible:
    id: "invoice_expenses_amount"
    text: "[-][$]120[.,]00"
- assertVisible:
    id: "invoice_advance_payments_amount"
    text: "[+][$]0[.,]00"
- assertVisible:
    id: "invoice_total_amount"
    text: "[$]120[.,]00"
- assertVisible: ${SPEND_TITLE}

# --- I pay $50.00 of it early --------------------------------------------------------------------
# The account is the default one, already selected by the modal; only the amount is this flow's to
# type. The date defaults to today, which the invoice's open period contains.
- tapOn:
    id: "invoice_advance_payment"
- extendedWaitUntil:
    visible:
      id: "advance_payment_amount"
    timeout: 15000
- tapOn:
    id: "advance_payment_amount"
- waitForAnimationToEnd
- inputText: ${ADVANCE_DIGITS}
- hideKeyboard
- tapOn:
    id: "advance_payment_confirm"
- extendedWaitUntil:
    notVisible:
      id: "advance_payment_amount"
    timeout: 15000

# What was spent is untouched — an early payment settles debt, it does not unspend anything — and
# what is owed is the difference.
- extendedWaitUntil:
    visible:
      id: "invoice_advance_payments_amount"
    timeout: 15000
- assertVisible:
    id: "invoice_expenses_amount"
    text: "[-][$]120[.,]00"
- assertVisible:
    id: "invoice_advance_payments_amount"
    text: "[+][$]50[.,]00"
- assertVisible:
    id: "invoice_total_amount"
    text: "[$]70[.,]00"

# --- The cards screen agrees, and so does the dashboard ------------------------------------------
- back
- extendedWaitUntil:
    visible:
      id: "screen_credit_cards"
    timeout: 15000
- assertVisible:
    id: "credit_card_invoice_amount"
    text: "[$]70[.,]00"
- assertVisible:
    id: "credit_card_available_limit"
    text: "[$]1[.,]930[.,]00"

# Now the cash did move: $500.00 earned less $50.00 paid to the card. The expense figure stays the
# income's counterpart — a card payment is not a category expense — so it is the balance that
# carries it.
- back
- scrollUntilVisible:
    element:
      id: "dashboard_total_balance_amount"
    direction: UP
    timeout: 25000
- assertVisible:
    id: "dashboard_total_balance_amount"
    text: "[$]450[.,]00"

- scrollUntilVisible:
    element:
      id: "dashboard_component_balance_stats_credit_card"
    direction: DOWN
    centerElement: true
    timeout: 25000
- assertVisible:
    id: "dashboard_credit_card_payment_amount"
    text: "[$]50[.,]00"
- assertVisible:
    id: "dashboard_credit_card_expenses_amount"
    text: "[$]120[.,]00"

- scrollUntilVisible:
    element:
      id: "dashboard_component_credit_cards_pager"
    direction: UP
    centerElement: true
    timeout: 25000
- assertVisible:
    id: "dashboard_credit_card_invoice_amount"
    text: "[$]70[.,]00"

# --- And the report tells both sides of it -------------------------------------------------------
# The two perspectives read the same two writes from opposite ends: the account paid, the card was
# paid. Either alone would be half the story.
- runFlow:
    file: ../../subflows/open_section.yaml
    env:
      SECTION: report
- extendedWaitUntil:
    visible:
      id: "report_generate"
    timeout: 15000

# The account, which opens selected: it earned $500.00 and $50.00 left it for the card.
- tapOn:
    id: "report_generate"
- extendedWaitUntil:
    visible:
      id: "report_balance_amount"
    timeout: 20000
- assertVisible:
    id: "report_opening_balance_amount"
    text: "[$]0[.,]00"
- assertVisible:
    id: "report_income_amount"
    text: "[+][$]500[.,]00"
- assertVisible:
    id: "report_expenses_amount"
    text: "[-][$]50[.,]00"
- assertVisible:
    id: "report_balance_amount"
    text: "[$]450[.,]00"

# The card, whose open invoice is selected for us: spent $120.00, $50.00 of it already paid,
# $70.00 still owed.
- back
- extendedWaitUntil:
    visible:
      id: "report_generate"
    timeout: 15000
- tapOn:
    id: "report_perspective_credit_card"
- extendedWaitUntil:
    visible: ${CARD_NAME}
    timeout: 15000
- tapOn:
    id: "report_generate"
- extendedWaitUntil:
    visible:
      id: "report_invoice_total_amount"
    timeout: 20000
- assertVisible: ${CARD_NAME}
- assertVisible:
    id: "report_invoice_expenses_amount"
    text: "[-][$]120[.,]00"
- assertVisible:
    id: "report_advance_payment_amount"
    text: "[+][$]50[.,]00"
- assertVisible:
    id: "report_invoice_total_amount"
    text: "[$]70[.,]00"
