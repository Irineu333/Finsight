appId: com.neoutils.finsight
name: installments_lifecycle
tags:
  - installments
  - creditcards
  - ledger
env:
  CARD_NAME: "E2E Card"
  CARD_LIMIT_DIGITS: "700000"
  CARD_CLOSING_DAY: "10"
  CARD_DUE_DAY: "20"
  SPEND_TITLE: "E2E Sofa"
  SPEND_DIGITS: "96000"
---
# One purchase, three invoices, one command to undo it. A $960.00 sofa in three, on a card with
# $7,000.00 of limit: each invoice owes $320.00 — one instalment — while the limit falls by the
# whole $960.00. That pair is the claim the flow exists for: paying in instalments does not spend
# everything on one invoice, it commits the whole limit and spreads the debt.
#
# The card is created inside this flow rather than inherited, because an instalment is refused if
# any invoice in its span is already closed, and a card created here has three open ones.
#
# The whole story runs forty-five days ahead of the real day, and the figures are unchanged by that:
# a card created under the moved clock opens its invoices relative to it. The jump is here as a
# regression test, because the sheet validates its date against the clock the app was given — read
# the system's instead, as it once did, and the date the sheet pre-filled itself reads as future,
# Save never enables, and nothing below this line can happen.

- runFlow: ../../subflows/launch_fresh.yaml
- launchApp:
    clearState: false
    arguments:
      clockOffsetDays: 45
- extendedWaitUntil:
    visible:
      id: "bottom_navigation_bar"
    timeout: 30000

# --- Nothing is being paid in instalments --------------------------------------------------------
- runFlow:
    file: ../../subflows/open_section.yaml
    env:
      SECTION: installments
- extendedWaitUntil:
    visible:
      id: "screen_installments"
    timeout: 15000
- assertVisible:
    id: "installments_empty_state"
- assertNotVisible:
    id: "installment_card"
- assertVisible:
    id: "installments_add"

# --- I have a card to pay with -------------------------------------------------------------------
- back
- runFlow:
    file: ../../subflows/open_section.yaml
    env:
      SECTION: creditCards
- extendedWaitUntil:
    visible:
      id: "screen_credit_cards"
    timeout: 15000
- runFlow:
    file: ../../subflows/create_credit_card.yaml
    env:
      NAME: ${CARD_NAME}
      LIMIT: ${CARD_LIMIT_DIGITS}
      CLOSING_DAY: ${CARD_CLOSING_DAY}
      DUE_DAY: ${CARD_DUE_DAY}
- extendedWaitUntil:
    visible:
      id: "credit_card_card"
    timeout: 15000
- assertVisible:
    id: "credit_card_invoice_amount"
    text: "[$]0[.,]00"
- assertVisible:
    id: "credit_card_available_limit"
    text: "[$]7[.,]000[.,]00"

# --- I buy a sofa in three -----------------------------------------------------------------------
- back
- runFlow:
    file: ../../subflows/open_section.yaml
    env:
      SECTION: installments
- extendedWaitUntil:
    visible:
      id: "installments_empty_state"
    timeout: 15000
- tapOn:
    id: "installments_add"

# The sheet resolves its card and its first invoice asynchronously; waiting for the card's name is
# what makes the two assertions below measure rules rather than loading.
- extendedWaitUntil:
    visible: ${CARD_NAME}
    timeout: 15000
- assertVisible:
    id: "add_installment_save"
    enabled: false
# Two is the floor, and the screen says so rather than failing on submit: there is no such thing as
# paying in one instalment.
- assertVisible:
    id: "installment_counter_decrease"
    enabled: false

- tapOn:
    id: "add_installment_title"
- waitForAnimationToEnd
- inputText: ${SPEND_TITLE}
- assertVisible:
    id: "add_installment_title"
    text: ${SPEND_TITLE}
- hideKeyboard

- scrollUntilVisible:
    element:
      id: "add_installment_amount"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "add_installment_amount"
- waitForAnimationToEnd
- inputText: ${SPEND_DIGITS}
- assertVisible:
    id: "add_installment_amount"
    text: "[$]960[.,]00"
- hideKeyboard

# Three, and what three is worth — the one reading this flow needs, because every figure it
# asserts from here on follows from it. That the division itself is right for two, for four, and
# for an amount that does not divide is `InstallmentStateTest`: arithmetic does not need a device.
- tapOn:
    id: "installment_counter_increase"
- waitForAnimationToEnd
- assertVisible:
    id: "installment_counter_label"
    text: "3x.*320[.,]00"
- assertVisible:
    id: "add_installment_save"
    enabled: true

- scrollUntilVisible:
    element:
      id: "add_installment_save"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "add_installment_save"
- extendedWaitUntil:
    notVisible:
      id: "add_installment_amount"
    timeout: 15000

# --- One decision, three transactions ------------------------------------------------------------
# `totalAmount` and `remaining` both read $960.00 on purpose: nothing has been paid yet, so what is
# left is the whole of it.
- extendedWaitUntil:
    visible:
      id: "installment_card"
    timeout: 15000
- assertNotVisible:
    id: "installments_empty_state"
- assertVisible:
    id: "installment_status"
    text: "Active"
- assertVisible:
    id: "installment_total_amount"
    text: "[$]960[.,]00"
- assertVisible:
    id: "installment_current_number"
    text: "01"
# Its other half: "01" alone does not say of how many, and the count is what the split decided.
- assertVisible:
    id: "installment_total_count"
    text: ".*3"
- assertVisible:
    id: "installment_remaining_amount"
    text: "[$]960[.,]00"
# Deletion is offered while every invoice in the span still accepts a change.
- assertVisible:
    id: "installment_delete"

# The three rows, each carrying its position in the series.
- assertVisible:
    id: "transaction_card_title"
    text: "${SPEND_TITLE} . 1/3"
- assertVisible:
    id: "transaction_card_amount"
    text: "[$]320[.,]00"
- scrollUntilVisible:
    element:
      id: "transaction_card_title"
      text: "${SPEND_TITLE} . 3/3"
    direction: DOWN
    centerElement: true
    timeout: 25000

# --- The claim: one instalment owed, the whole purchase committed --------------------------------
- back
- runFlow:
    file: ../../subflows/open_section.yaml
    env:
      SECTION: creditCards
- extendedWaitUntil:
    visible:
      id: "screen_credit_cards"
    timeout: 15000
- assertVisible:
    id: "credit_card_invoice_amount"
    text: "[$]320[.,]00"
- assertVisible:
    id: "credit_card_available_limit"
    text: "[$]6[.,]040[.,]00"

# --- Each invoice carries exactly one instalment --------------------------------------------------
- tapOn:
    id: "credit_card_card"
- extendedWaitUntil:
    visible:
      id: "screen_invoice_transactions"
    timeout: 15000
- assertVisible:
    id: "invoice_expenses_amount"
    text: "[-][$]320[.,]00"
- assertVisible:
    id: "invoice_total_amount"
    text: "[$]320[.,]00"
- assertVisible:
    id: "transaction_card_title"
    text: "${SPEND_TITLE} . 1/3"

# The next invoice is the page to the right, so the gesture travels leftwards — and starts away from
# the right edge, which the system would read as a back gesture instead of a page turn.
- swipe:
    start: "75%, 30%"
    end: "20%, 30%"
    duration: 500
- extendedWaitUntil:
    visible:
      id: "transaction_card_title"
      text: "${SPEND_TITLE} . 2/3"
    timeout: 15000
- assertVisible:
    id: "invoice_total_amount"
    text: "[$]320[.,]00"

# --- The dashboard: debt, not cash, and only this month's part of it -----------------------------
- back
- back
- scrollUntilVisible:
    element:
      id: "dashboard_total_balance_amount"
    direction: UP
    timeout: 25000
- assertVisible:
    id: "dashboard_total_balance_amount"
    text: "[$]0[.,]00"
- scrollUntilVisible:
    element:
      id: "dashboard_component_balance_stats_credit_card"
    direction: DOWN
    centerElement: true
    timeout: 25000
- assertVisible:
    id: "dashboard_credit_card_expenses_amount"
    text: "[$]320[.,]00"
- scrollUntilVisible:
    element:
      id: "dashboard_component_credit_cards_pager"
    direction: UP
    centerElement: true
    timeout: 25000
- assertVisible:
    id: "dashboard_credit_card_invoice_amount"
    text: "[$]320[.,]00"

# The month's list holds this month's instalment, and only it — the other two belong to months that
# have not arrived.
- tapOn:
    id: "nav_item_transactions"
- extendedWaitUntil:
    visible:
      id: "screen_transactions"
    timeout: 15000
- assertVisible:
    id: "transaction_card_title"
    text: "${SPEND_TITLE} . 1/3"
- assertVisible:
    id: "transaction_card_amount"
    text: "[$]320[.,]00"
- assertNotVisible:
    id: "transaction_card_title"
    text: "${SPEND_TITLE} . 2/3"

# --- And a month on, the second instalment is the one on the list --------------------------------
# The other half of the claim above. "Not in this month" alone would also hold if the instalment had
# been written nowhere at all, which is exactly the bug it is supposed to catch.
#
# Shifted by a calendar month rather than by thirty-one days: +31 from the 30th of a long month
# lands two months on, and the flow would be red on a handful of days a year for a reason nothing on
# screen names. The day offset is carried along, because the whole story lives forty-five days ahead.
- launchApp:
    clearState: false
    arguments:
      clockOffsetDays: 45
      clockOffsetMonths: 1
- extendedWaitUntil:
    visible:
      id: "bottom_navigation_bar"
    timeout: 30000
- tapOn:
    id: "nav_item_transactions"
- extendedWaitUntil:
    visible:
      id: "screen_transactions"
    timeout: 15000
- assertVisible:
    id: "transaction_card_title"
    text: "${SPEND_TITLE} . 2/3"
- assertVisible:
    id: "transaction_card_amount"
    text: "[$]320[.,]00"
- assertNotVisible:
    id: "transaction_card_title"
    text: "${SPEND_TITLE} . 1/3"

# Back to where the rest of the story stands, so the undo below is read on the month that holds
# instalment one.
- launchApp:
    clearState: false
    arguments:
      clockOffsetDays: 45
- extendedWaitUntil:
    visible:
      id: "bottom_navigation_bar"
    timeout: 30000

# --- I undo the purchase -------------------------------------------------------------------------
# Created as one thing and undone as one thing: three transactions, across three invoices, removed
# by a single command.
- tapOn:
    id: "nav_item_dashboard"
- runFlow:
    file: ../../subflows/open_section.yaml
    env:
      SECTION: installments
- extendedWaitUntil:
    visible:
      id: "installment_delete"
    timeout: 15000
- tapOn:
    id: "installment_delete"
- extendedWaitUntil:
    visible:
      id: "delete_installment_confirm"
    timeout: 15000
- tapOn:
    id: "delete_installment_confirm"
- extendedWaitUntil:
    visible:
      id: "screen_installments"
    timeout: 15000
- assertVisible:
    id: "installments_empty_state"
- assertNotVisible:
    id: "installment_card"

# ...and nothing of it is left: the invoice owes nothing and the whole limit is back.
- back
- runFlow:
    file: ../../subflows/open_section.yaml
    env:
      SECTION: creditCards
- extendedWaitUntil:
    visible:
      id: "screen_credit_cards"
    timeout: 15000
- assertVisible:
    id: "credit_card_invoice_amount"
    text: "[$]0[.,]00"
- assertVisible:
    id: "credit_card_available_limit"
    text: "[$]7[.,]000[.,]00"

- back
# The screen has to be gone before the tap, or the tap races the exit animation.
- extendedWaitUntil:
    notVisible:
      id: "screen_credit_cards"
    timeout: 15000
- tapOn:
    id: "nav_item_transactions"
- extendedWaitUntil:
    visible:
      id: "screen_transactions"
    timeout: 15000
- assertNotVisible:
    id: "transaction_card_title"
