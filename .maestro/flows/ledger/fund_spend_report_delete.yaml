appId: com.neoutils.finsight
name: ledger_fund_spend_report_delete
tags:
  - ledger
env:
  INCOME_TITLE: "E2E Salary"
  INCOME_DIGITS: "50000"
  EXPENSE_TITLE: "E2E Coffee"
  EXPENSE_DIGITS: "4290"
---
# One story, told once: a US user installs the app, is paid, spends, checks the report, and undoes
# the spend. It is a single flow because `launch_fresh` wipes the database — split in two, the
# second half would have to re-earn the money before it could spend it.
#
# Every figure is asserted on the node that renders it (`id` + `text` in one selector), so a pass
# means "this number is here", not "this number is somewhere on screen". The amounts — 500.00 and
# 42.90, leaving 457.10 — share no digits, so no assertion can succeed by matching a neighbour.

- runFlow: ../../subflows/launch_fresh.yaml

# --- I have an American account, and it is empty -------------------------------------------------
- runFlow:
    file: ../../subflows/open_section.yaml
    env:
      SECTION: accounts
- extendedWaitUntil:
    visible:
      id: "screen_accounts"
    timeout: 15000
- assertVisible:
    id: "account_default_badge"
- assertVisible:
    id: "account_balance_amount"
    text: "[$]0[.,]00"
- assertVisible:
    id: "account_opening_balance_amount"
    text: "[$]0[.,]00"

# --- I am paid $500.00 ---------------------------------------------------------------------------
- back
- runFlow:
    file: ../../subflows/record_transaction.yaml
    env:
      TYPE: income
      TITLE: ${INCOME_TITLE}
      AMOUNT: ${INCOME_DIGITS}

# ...the dashboard totals move, and the transaction is in Recents — below the fold, hence the scroll.
- scrollUntilVisible:
    element:
      id: "dashboard_total_balance_amount"
    direction: UP
    timeout: 25000
- assertVisible:
    id: "dashboard_total_balance_amount"
    text: "[$]500[.,]00"
- assertVisible:
    id: "dashboard_income_amount"
    text: "[$]500[.,]00"
- scrollUntilVisible:
    element:
      text: ${INCOME_TITLE}
    direction: DOWN
    centerElement: true
    timeout: 25000
- assertVisible:
    id: "transaction_card_amount"
    text: "[$]500[.,]00"

# ...it is in the transaction list...
- tapOn:
    id: "nav_item_transactions"
- extendedWaitUntil:
    visible:
      id: "screen_transactions"
    timeout: 15000
- assertVisible: ${INCOME_TITLE}
- assertVisible:
    id: "transaction_card_amount"
    text: "[$]500[.,]00"

# ...and it landed on the account.
- tapOn:
    id: "nav_item_dashboard"
- runFlow:
    file: ../../subflows/open_section.yaml
    env:
      SECTION: accounts
- extendedWaitUntil:
    visible:
      id: "screen_accounts"
    timeout: 15000
- assertVisible:
    id: "account_income_amount"
    text: "[+][$]500[.,]00"
- assertVisible:
    id: "account_balance_amount"
    text: "[$]500[.,]00"

# --- I spend $42.90 ------------------------------------------------------------------------------
- back
- runFlow:
    file: ../../subflows/record_transaction.yaml
    env:
      TYPE: expense
      TITLE: ${EXPENSE_TITLE}
      AMOUNT: ${EXPENSE_DIGITS}

# 500.00 − 42.90 = 457.10. This is the assertion the whole suite exists for: two writes of different
# natures, summed by the ledger and read back through the UI.
- scrollUntilVisible:
    element:
      id: "dashboard_total_balance_amount"
    direction: UP
    timeout: 25000
- assertVisible:
    id: "dashboard_total_balance_amount"
    text: "[$]457[.,]10"
- assertVisible:
    id: "dashboard_expenses_amount"
    text: "[$]42[.,]90"
- scrollUntilVisible:
    element:
      text: ${EXPENSE_TITLE}
    direction: DOWN
    centerElement: true
    timeout: 25000
- assertVisible:
    id: "transaction_card_amount"
    text: "[$]42[.,]90"

- tapOn:
    id: "nav_item_transactions"
- extendedWaitUntil:
    visible:
      id: "screen_transactions"
    timeout: 15000
- assertVisible: ${EXPENSE_TITLE}
- assertVisible: ${INCOME_TITLE}

- tapOn:
    id: "nav_item_dashboard"
- runFlow:
    file: ../../subflows/open_section.yaml
    env:
      SECTION: accounts
- extendedWaitUntil:
    visible:
      id: "screen_accounts"
    timeout: 15000
- assertVisible:
    id: "account_expenses_amount"
    text: "[-][$]42[.,]90"
- assertVisible:
    id: "account_balance_amount"
    text: "[$]457[.,]10"

# --- I check the report --------------------------------------------------------------------------
- back
# Worth its own checkpoint rather than a repeat of the dashboard: the report recomputes the same
# figures through `CalculateReportStatsUseCase`, a different path to the same truth.
- runFlow:
    file: ../../subflows/open_section.yaml
    env:
      SECTION: report
- extendedWaitUntil:
    visible:
      id: "report_generate"
    timeout: 15000
- tapOn:
    id: "report_generate"

- extendedWaitUntil:
    visible:
      id: "report_balance_amount"
    timeout: 20000
- assertVisible:
    id: "report_opening_balance_amount"
    text: "[$]0[.,]00"
- assertVisible:
    id: "report_income_amount"
    text: "[+][$]500[.,]00"
- assertVisible:
    id: "report_expenses_amount"
    text: "[-][$]42[.,]90"
- assertVisible:
    id: "report_balance_amount"
    text: "[$]457[.,]10"

# --- I undo the spend ----------------------------------------------------------------------------
# Two steps out of the report: the viewer, then the configuration screen that opened it.
- back
- back
- extendedWaitUntil:
    visible:
      id: "bottom_navigation_bar"
    timeout: 15000
- tapOn:
    id: "nav_item_transactions"
- extendedWaitUntil:
    visible:
      id: "screen_transactions"
    timeout: 15000
- tapOn: ${EXPENSE_TITLE}

- extendedWaitUntil:
    visible:
      id: "view_transaction_delete"
    timeout: 15000
- tapOn:
    id: "view_transaction_delete"
- extendedWaitUntil:
    visible:
      id: "delete_transaction_confirm"
    timeout: 15000
- tapOn:
    id: "delete_transaction_confirm"

# The expense is gone, the income is not, and the balance is exactly what it was before the spend.
- extendedWaitUntil:
    notVisible: ${EXPENSE_TITLE}
    timeout: 15000
- assertVisible: ${INCOME_TITLE}
- tapOn:
    id: "nav_item_dashboard"
- scrollUntilVisible:
    element:
      id: "dashboard_total_balance_amount"
    direction: UP
    timeout: 25000
- assertVisible:
    id: "dashboard_total_balance_amount"
    text: "[$]500[.,]00"
