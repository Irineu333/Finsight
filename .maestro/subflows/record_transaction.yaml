appId: com.neoutils.finsight
name: record_transaction
---
# Records one transaction from the FAB and leaves the app where it found it — the sheet dismissed,
# the dashboard behind it. Callers pass TYPE (income|expense), TITLE and AMOUNT.
#
# AMOUNT is bare digits: the field is a money input that places the separator itself, so "50000"
# is what a person presses to mean 500.00.
- tapOn:
    id: "add_transaction_fab"
# Anchored on the title field, not the submit button: the sheet scrolls, and how much of it fits
# depends on the device — the button can sit below the fold while the sheet is perfectly open.
- extendedWaitUntil:
    visible:
      id: "add_transaction_title"
    timeout: 15000

- tapOn:
    id: "add_transaction_type_${TYPE}"
# Switching the type animates rows in and out of the sheet; typing into a field while that settles
# loses the text silently, and the form then refuses to submit for a reason nothing on screen names.
- waitForAnimationToEnd

# The keyboard is put away between fields, not just at the end. Whatever the device raises while
# typing — the soft IME, or the hardware-keyboard toolbar newer Android versions show instead —
# overlays the sheet, and the next field can end up underneath it. `dismiss_keyboard`, never
# `hideKeyboard`: that one is Android's, and on iOS it fails the flow (README §2.5).
- tapOn:
    id: "add_transaction_title"
- waitForAnimationToEnd
- inputText: ${TITLE}
# Read the field back: a dropped keystroke has to fail here, not three screens later as a disabled
# button with no explanation.
- assertVisible:
    id: "add_transaction_title"
    text: ${TITLE}
- runFlow: dismiss_keyboard.yaml

- scrollUntilVisible:
    element:
      id: "add_transaction_amount"
    direction: DOWN
    timeout: 15000
- waitForAnimationToEnd
- tapOn:
    id: "add_transaction_amount"
- waitForAnimationToEnd
- inputText: ${AMOUNT}
- runFlow: dismiss_keyboard.yaml

- scrollUntilVisible:
    element:
      id: "add_transaction_save"
    direction: DOWN
    timeout: 15000
- waitForAnimationToEnd
- tapOn:
    id: "add_transaction_save"
- extendedWaitUntil:
    notVisible:
      id: "add_transaction_title"
    timeout: 15000
